name: Update profile

on:
  schedule:
    # Every day at 04:17 UTC — off the hour to stay clear of GitHub's cron rush.
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_profile.py"
      - "scripts/build_hero.py"
      - "scripts/build_dashboard.py"
      - "scripts/build_badges.py"
      - "scripts/build_tiles.py"
      - "scripts/build_3d_terrain.py"
      - "scripts/capture_age.py"
      - "scripts/tokens.py"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild live-site showcase from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_REPO: ${{ github.event.repository.name }}
        run: python3 scripts/build_profile.py

      - name: Re-render the self-hosted hero from the same data
        env:
          PROFILE_REPO: ${{ github.event.repository.name }}
        run: python3 scripts/build_hero.py

      - name: Redraw the self-hosted badges
        run: python3 scripts/build_badges.py

      - name: Refresh the signal dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_dashboard.py

      # Rerun even when nothing else moved: refresh-ctimes.yml pings this on a
      # timer so the LIVE animation can fade once a capture is old, without a
      # second scheduled job here.
      - name: Emit the design tokens the web pages read
        run: python3 scripts/tokens.py --emit

      - name: Record how old each capture is
        run: python3 scripts/capture_age.py

      - name: Redraw the live-window tiles
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/build_tiles.py

      - name: Draw the contribution terrain from the fresh calendar
        run: python3 scripts/build_3d_terrain.py --offline

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md data/ assets/; then
            echo "Profile is already up to date."
            exit 0
          fi
          git add README.md data/ assets/
          git commit -m "🤖 Refresh live sites and stats [skip ci]"
          # the screenshot job may have pushed meanwhile; rebase before pushing
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
