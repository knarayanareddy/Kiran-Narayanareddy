# Publishes web/ (the interactive snake + dashboards) to GitHub Pages.
#
# Needs Pages switched on once for this repo: Settings -> Pages -> Source:
# "GitHub Actions". The API refuses to create the site with the built-in token
# ("Resource not accessible by integration"), so this workflow deploys when it
# can and quietly skips when Pages is not enabled yet, rather than failing red.
name: Publish interactive pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/stats.json"
      - "data/tokens.json"
      - "assets/reels/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is Pages enabled for this repository?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not enabled. Settings -> Pages -> Source: GitHub Actions, then re-run."
          fi

      # The pages fetch "../data/<file>.json" so that the same file works both
      # from here and over file://, which means _site/data/ has to exist at the
      # site root. Publishing only stats.json was a silent bug: index.html also
      # asks for tokens.json, and when it 404s the page quietly draws from a
      # hardcoded palette that drifts from scripts/tokens.py. Publish the whole
      # directory and the drift cannot happen.
      - name: Assemble the site
        if: steps.check.outputs.enabled == 'true'
        run: |
          set -eu
          mkdir -p _site
          # web/ is exactly what gets published: flat copies plus the directory
          # copies below were the same bytes in two places, and a stale copy is
          # invisible until someone loads the wrong URL.
          cp -r web/* _site/
          mkdir -p _site/data
          cp data/*.json _site/data/
          # The reel player streams recordings from this same origin, so they are
          # published next to it: no Camo, no 5 MB ceiling, no proxy.
          mkdir -p _site/reels
          cp assets/reels/manifest.json _site/reels/manifest.json
          cp assets/reels/*.gif assets/reels/*-cover.png _site/reels/
          echo "published: $(ls _site/reels | wc -l) reel assets, $(ls _site/data | wc -l) data files"
          # Fail loudly rather than shipping a page whose styles silently fall back.
          for f in _site/data/stats.json _site/data/tokens.json _site/index.html _site/snake.html _site/reel.html; do
            test -f "$f" || { echo "::error::missing $f in the published site"; exit 1; }
          done

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.check.outputs.enabled == 'true'
        id: deployment
