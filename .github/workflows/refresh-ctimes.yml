# Keeps the "live window" tiles honest.
#
# Capture age is now recorded inside the nightly profile job (capture_age.py),
# which already commits assets/ — so this workflow no longer needs to write
# anything, and no longer tries to dispatch another workflow. That dispatch was
# broken: GITHUB_TOKEN cannot create workflow_dispatch events (403 "Resource not
# accessible by integration"), so it silently did nothing after doing its work.
#
# What is left is the integrity check that actually matters: a capture that has
# gone stale must not keep pulsing LIVE. If one has, this fails the run so it
# shows up instead of quietly rotting on the profile.
name: Check capture freshness

on:
  schedule:
    - cron: "40 3 * * *"   # just before the 04:17 profile refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every tile claiming LIVE must have a recent capture
        run: |
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          state_path = "assets/tiles/state.json"
          if not os.path.exists(state_path):
              print("no state.json yet; nothing to check")
              sys.exit(0)

          with open(state_path, encoding="utf-8") as handle:
              state = json.load(handle)

          checked = state.get("checked", "unknown")
          sites = state.get("sites", {})
          stale = sorted(repo for repo, info in sites.items() if not info.get("confirmed_live"))
          fresh = len(sites) - len(stale)

          print(f"### Capture freshness\n")
          print(f"- checked: `{checked}`")
          print(f"- confirmed live: **{fresh}/{len(sites)}**")
          if stale:
              print(f"- stale (pill downgraded to 'captured'): {', '.join(stale)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Capture freshness: {fresh}/{len(sites)} live")
              if stale:
                  summary.write(f" · stale: {', '.join(stale)}")
              summary.write("\n")

          # Staleness is not a failure on its own: the tile already tells the
          # truth. It is a failure when the pipeline stopped refreshing at all,
          # which is what all-stale means.
          if sites and not fresh:
              print("::error::every capture is stale - the screenshot pipeline has stopped")
              sys.exit(1)
          PY
