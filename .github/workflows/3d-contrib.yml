# Draws the interactive contribution terrain.
#
# This used to call yoshi389111/github-profile-3d-contrib, which produces a pretty
# static render with no dates in it. The terrain is now ours: one block per day,
# every block carrying its date and count, drawn from the same calendar the
# signal dashboard uses. Same data, one fewer third-party action.
name: 3D contribution terrain

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_3d_terrain.py"
      - ".github/workflows/3d-contrib.yml"

permissions:
  contents: write

concurrency:
  group: 3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the terrain from the contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_dashboard.py        # refreshes data/stats.json
          python3 scripts/build_3d_terrain.py --offline

      - name: Commit if the terrain changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/terrain-*.svg data/stats.json; then
            echo "Terrain already current."
            exit 0
          fi
          git add assets/terrain-*.svg data/stats.json
          git commit -m "🏔️ Redraw the contribution terrain [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
