# The interactive pages have real logic in them (BFS pathfinding, flood-fill
# safety, wrap-around collision, the isometric projection). This runs it headless
# on every push, so "it works" is a check result rather than a claim.
name: Test the interactive pages

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "web/**"
      - "scripts/tokens.py"
      - "scripts/build_reel.py"
      - "tests/reels.test.mjs"
      - "data/tokens.json"
      - "tests/**"
      - "README.md"
      - ".github/workflows/pages.yml"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # run.sh is the list of test files: it emits the tokens, then runs every
      # suite. Enumerating the files here too meant a new suite could sit in the
      # repo forever without ever running in CI.
      - name: Simulation, projection and link tests
        run: sh tests/run.sh
